            "name": "What can CineWindows play?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "CineWindows uses libmpv and FFmpeg, so it supports a broad range of video, audio, subtitle, and playlist formats. That includes common MP4, MKV, AVI, MOV, MP3, FLAC, SRT, ASS, SSA, VTT, M3U, and M3U8 files."
            }
          },
          {
            "@type": "Question",
            "name": "Does it require an account or internet connection?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No account is required. Local playback works offline. An internet connection is only needed for online streams, opening external links, or checking GitHub for app updates."
            }
          },
          {
            "@type": "Question",
            "name": "Can I stream from a URL?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. CineWindows includes yt-dlp integration for supported media URLs. Availability depends on the provider, your network, and the provider's own terms."
            }
          },
          {
            "@type": "Question",
            "name": "Can I customize keyboard shortcuts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Every key binding can be changed in Preferences, and advanced users can work directly with an mpv-style input configuration."
            }
          },
          {
            "@type": "Question",
            "name": "Does CineWindows collect analytics?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. CineWindows does not include analytics, advertising trackers, or an account system. Optional update checks contact GitHub, and online playback connects to the media provider you choose."
            }
          }
