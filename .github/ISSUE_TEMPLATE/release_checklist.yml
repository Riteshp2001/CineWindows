name: Release checklist
description: Track a CineWindows release from version bump through packaged artifacts.
title: "Release v"
labels:
  - release
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The version being released, without the leading v.
      placeholder: "1.0.3"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      options:
        - Stable
        - Preview
        - Nightly
    validations:
      required: true
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: Version is updated in CMakeLists.txt and resources/windows/CineWindows.rc.
        - label: User-facing strings were refreshed with scripts/generate/update_translations.ps1.
        - label: CI is green on the release branch or tag candidate.
        - label: Playback smoke test covers local video, audio-only file, URL playback, subtitles, and drag/drop.
        - label: Windows installer and portable zip were generated by scripts/package/deploy_windows.ps1.
        - label: Linux AppImage and Flatpak bundles were generated and their checksums verified.
        - label: Installer installs, launches, creates shortcuts, and uninstalls cleanly on a clean Windows machine.
        - label: Release notes mention known limitations and dependency requirements.
  - type: textarea
    id: highlights
    attributes:
      label: Release highlights
      description: Short user-facing bullets for the GitHub release notes.
      placeholder: |
        - Improved video rendering on Windows.
        - Polished playback controls and popovers.
    validations:
      required: true
  - type: textarea
    id: known_issues
    attributes:
      label: Known issues
      description: Anything users should know before installing.
      placeholder: "None known."
