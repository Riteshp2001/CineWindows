name: Build And Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE + Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-mpv
            mingw-w64-x86_64-blueprint-compiler
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-yt-dlp
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-ntldd

      - name: Install Python dependencies
        shell: msys2 {0}
        run: pip install --quiet -r requirements.txt

      - name: Build Windows package
        shell: msys2 {0}
        run: powershell.exe -NoProfile -File scripts/build_windows.ps1

      - name: Create ZIP archive
        shell: pwsh
        run: |
          7z a -mx9 "CineWindows-${{ github.ref_name }}-windows-x64.zip" ".\dist\CineWindows\*"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"' `
            | ForEach-Object { $_.Matches.Groups[1].Value }
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPP_VERSION=$version" scripts/installer.nsi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CineWindows-windows-x64
          path: |
            dist/CineWindows/
            CineWindows-*.zip
            CineWindows-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CineWindows-*.zip
            CineWindows-*.exe
          generate_release_notes: true
