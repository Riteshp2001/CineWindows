name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-mpv
            mingw-w64-x86_64-yt-dlp
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-blueprint-compiler
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-shared-mime-info
            mingw-w64-x86_64-desktop-file-utils

      - name: Install Python dependencies
        shell: msys2 {0}
        run: pip install --quiet -r requirements.txt

      - name: Export MSYS2 root
        shell: msys2 {0}
        run: echo "MINGW_ROOT=$(cygpath -w /mingw64)" >> $GITHUB_ENV

      - name: Build release bundle
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Configuration Release -StripPythonSources

      - name: Create zip archive
        run: |
          Compress-Archive -Path dist\CineWindows -DestinationPath CineWindows.zip

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Generate Windows icon
        shell: msys2 {0}
        run: |
          pip install --quiet pillow
          python scripts/create_icon.py

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"' `
            | ForEach-Object { $_.Matches.Groups[1].Value }
          if (-not (Test-Path "CineWindows.ico")) {
            throw "CineWindows.ico is required for NSIS installer but could not be generated"
          }
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPP_VERSION=$version" scripts/installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: CineWindows
          path: |
            CineWindows.zip
            CineWindows-*.exe
