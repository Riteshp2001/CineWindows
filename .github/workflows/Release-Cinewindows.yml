name: Release CineWindows

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: CineWindows

jobs:
  windows:
    name: Windows x64 package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-mpv
            mingw-w64-x86_64-vapoursynth
            mingw-w64-x86_64-blueprint-compiler
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-yt-dlp
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-ntldd

      - name: Install Python dependencies
        shell: msys2 {0}
        run: pip install --quiet -r requirements.txt

      - name: Export MSYS2 root
        shell: msys2 {0}
        run: echo "MINGW_ROOT=$(cygpath -w /mingw64)" >> $GITHUB_ENV

      - name: Verify source syntax
        shell: pwsh
        run: |
          python -m py_compile `
            src/main.py `
            src/utils/compat.py `
            src/utils/constants.py `
            src/utils/interp_config.py `
            src/utils/utils.py `
            src/views/preferences.py `
            src/views/shortcuts.py `
            src/views/window.py
          python -c "import py_compile; py_compile.compile('scripts/rife.vpy', doraise=True)"

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Configuration Release -StripPythonSources

      - name: Create ZIP archive
        shell: pwsh
        run: |
          7z a -mx9 "${{ env.APP_NAME }}-${{ github.ref_name }}-windows-x64.zip" ".\dist\${{ env.APP_NAME }}\*"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Generate Windows icon
        shell: msys2 {0}
        run: |
          pip install --quiet pillow
          python scripts/create_icon.py

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"' |
            ForEach-Object { $_.Matches.Groups[1].Value }
          $versionQuad = "$version.0"
          if (-not (Test-Path "CineWindows.ico")) {
            throw "CineWindows.ico is required for NSIS installer but could not be generated"
          }
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DAPP_VERSION=$version" `
            "/DAPP_VERSION_QUAD=$versionQuad" `
            scripts/installer.nsi

      - name: Select release notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $notes = ".github/release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) {
            $notes = "RELEASE_NOTES.md"
            Set-Content -Path $notes -Encoding UTF8 -Value @(
              "# ${{ env.APP_NAME }} ${{ github.ref_name }}",
              "",
              "See the commits included in this tag for the full change list."
            )
          }
          "body_path=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-windows-x64
          path: |
            dist/CineWindows/
            CineWindows-*.zip
            CineWindows-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.release_notes.outputs.body_path }}
          files: |
            CineWindows-*.zip
            CineWindows-*.exe
          make_latest: true
